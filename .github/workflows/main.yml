name: Build Paie Burkina APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.cache/pip
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            git zip unzip openjdk-17-jdk python3-pip autoconf \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libfreetype6-dev libpng-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Fix Android SDK paths for Buildozer
        run: |
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          SYSTEM_SDK="/usr/local/lib/android/sdk"
          mkdir -p "$BUILDOZER_SDK"
          cp -r "$SYSTEM_SDK/." "$BUILDOZER_SDK/" || true
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          ln -sf "$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK/tools/bin/sdkmanager" || true
          ln -sf "$BUILDOZER_SDK/cmdline-tools/latest/bin/avdmanager" "$BUILDOZER_SDK/tools/bin/avdmanager" || true
          mkdir -p "$BUILDOZER_SDK/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$BUILDOZER_SDK/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$BUILDOZER_SDK/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$BUILDOZER_SDK/licenses/android-sdk-preview-license"

      - name: Pre-download Python packages
        run: |
          pip download kivy kivymd openpyxl pillow --no-deps -d ~/.buildozer/cache/

      - name: Build APK with retry
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 150
          max_attempts: 3
          retry_on: error
          command: |
            export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
            export ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r25b
            buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paie-burkina-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: warn
